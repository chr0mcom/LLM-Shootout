# Web interface of LLM Shootout behind a Traefik reverse proxy.
#
# Everything that depends on your server is a variable. Copy `.env.example` to `.env` (not versioned) and fill in
# at least SHOOTOUT_HOST. Secrets (web password, OpenRouter token) live in a file outside the repository, by default
# ~/.config/llm-shootout/env (set LLMSHOOTOUT_ENV_FILE for another path), never in this file.
#
#   GIT_COMMIT=$(git rev-parse --short=12 HEAD) docker compose build --no-cache web && docker compose up -d web
#
# Without Traefik: delete the `labels`, the `networks` blocks, and add `ports: ["8080:8080"]` to the service.
# Local models or a gateway: add `-f docker-compose.gateway.yml` (see that file).
name: llm-shootout

services:
  web:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: llm-shootout-web:latest
    container_name: llm-shootout-web
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - ${LLMSHOOTOUT_ENV_FILE:-${HOME}/.config/llm-shootout/env}
    volumes:
      - shootout-data:/data
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${SHOOTOUT_TRAEFIK_NETWORK:-proxy}"
      - "traefik.http.routers.llm-shootout.rule=Host(`${SHOOTOUT_HOST:?set SHOOTOUT_HOST in .env, see .env.example}`)"
      - "traefik.http.routers.llm-shootout.entrypoints=${SHOOTOUT_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.llm-shootout.tls=true"
      - "traefik.http.routers.llm-shootout.tls.certresolver=${SHOOTOUT_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.llm-shootout.middlewares=${SHOOTOUT_MIDDLEWARES:-}"
      - "traefik.http.services.llm-shootout.loadbalancer.server.port=8080"

volumes:
  shootout-data:

networks:
  traefik:
    external: true
    name: ${SHOOTOUT_TRAEFIK_NETWORK:-proxy}
